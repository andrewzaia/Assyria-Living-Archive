name: Validate website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test preservation integrity and ZIP recovery
        run: python scripts/test_preservation.py
      - name: Test source and accessibility audit handling
        run: |
          python scripts/test_source_accessibility.py
          python scripts/audit_sources.py
      - name: Test accessioned cuneiform and object case metadata
        run: python scripts/test_case_files.py
      - name: Test original-language source attribution and uncertainty rules
        run: python scripts/test_text_comparisons.py
      - name: Test historical concordance source and reference integrity
        run: python scripts/test_concordance.py
      - name: Verify historical name and identity disambiguation
        run: python scripts/test_identity_register.py
      - name: Test primary royal editions and biblical comparison scopes
        run: python scripts/test_royal_witnesses.py
      - name: Test Fall of Samaria and Assyrian succession source accuracy
        run: python scripts/test_samaria_succession.py
      - name: Test exile, resettlement and provincial source scopes
        run: python scripts/test_exile_provinces.py
      - name: Verify Chaldean church naming, Assyrian heritage and independent source boundaries
        run: python scripts/test_chaldean_identity.py
      - name: Test Explore category filtering, header search startup and deep links
        run: node --test scripts/test_explore_filters.mjs
      - name: Test site-wide article review and exact local primary text
        run: python scripts/test_content_depth.py
      - name: Test article paragraphs and compact pinpoint citations
        run: python scripts/test_article_citations.py
      - name: Test Middle Assyrian tiles against Explore card hover and theme styles
        run: python scripts/test_middle_assyrian_hover.py
      - name: Test balanced menus and complete navigation coverage
        run: python scripts/test_navigation.py
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/map.js
          node --check static/samaria-succession.js
          node --check static/exile-provinces.js
          node --check static/bible.js
          node --check static/heritage.js
          node --check worker/src/index.mjs
          node --test worker/tests/*.test.mjs
      - name: Build and validate root deployment
        env:
          BASE_PATH: ''
        run: |
          python generate.py
          python scripts/validate.py
          python scripts/test_public_domain.py
          python scripts/export_archive.py --output "${RUNNER_TEMP}/assyria-root-site.zip"
      - name: Build and validate project-path deployment
        env:
          BASE_PATH: /Assyria
          SITE_URL: https://example.com
        run: |
          python generate.py
          python scripts/validate.py
